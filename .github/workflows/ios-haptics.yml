name: iOS Metal and Haptics SDK Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-haptics.yml
      - kit/host/gpu/metal/**
      - kit/host/gpu/gpu_factory.cpp
      - kit/host/gpu/gpu_factory.h
      - kit/host/gpu/CMakeLists.txt
      - kit/cmake/Dependencies.cmake
      - kit/host/sdl/platform_ui_ios.mm
      - kit/host/controls/rumble_mailbox.h
      - kit/host/controls/haptic_startup.h
      - kit/host/controls/haptic_intensity.h
      - kit/tools/test.py

permissions:
  contents: read

jobs:
  haptics-sdk:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Install pinned tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r kit/requirements-dev.txt
      - name: Compile iOS Metal and haptics enabled and disabled
        run: .venv/bin/python tools/test.py --ios-haptics
      - name: Link Metal-only iOS stub app and verify GPU archive
        run: .venv/bin/python tools/test.py --ios-metal-only --jobs 4
