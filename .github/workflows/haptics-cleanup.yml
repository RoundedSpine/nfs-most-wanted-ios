
name: Apply Haptics Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply cleanup
        run: python3 apply_haptics_cleanup.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kit/host/sdl/platform_ui_ios.mm
          if ! git diff --cached --quiet; then
            git commit -m "Clean up UIKit haptics implementation"
            git push
          fi
