name: Haptics Regression Tests
on:
  push:
    branches:
      - testing/haptics-core-repair
  workflow_dispatch:
jobs:
  objcxx-ios-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Install SDL3 headers for Objective-C++ syntax check
        run: brew install sdl3
      - name: Compile actual iOS Objective-C++ bridge (arm64 iPhoneOS)
        run: bash tests/haptics/compile_ios_objcxx.sh
  production-fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate Core Haptics reset/stop races with production scheduler
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer tests/haptics/production_scheduler_fault_test.cpp -o /tmp/haptic-fault
          /tmp/haptic-fault
  production-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and stress-test production single-owner drain
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer tests/haptics/drain_scheduler_test.cpp -o /tmp/haptic-drain
          /tmp/haptic-drain
  production-mailbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and stress-test production mailbox (ASan + UBSan)
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer tests/haptics/request_mailbox_test.cpp -o /tmp/haptic-mailbox
          /tmp/haptic-mailbox
  lifecycle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit implemented lifecycle contracts and report remaining gaps
        run: python3 tests/haptics/lifecycle_contract_test.py
  lifecycle-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run deterministic lifecycle fault injection (ASan + UBSan)
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/haptics/lifecycle_model_test.cpp -o /tmp/haptics-lifecycle-model
          /tmp/haptics-lifecycle-model
  rumble-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run router tests (ASan + UBSan)
        run: |
          c++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer kit/host/controls/haptics.cpp tests/haptics/rumble_router_test.cpp -o /tmp/rumble-router-test
          /tmp/rumble-router-test
