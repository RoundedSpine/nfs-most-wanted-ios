name: Check upstream updates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out iOS port
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream commits
        id: check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/elforeign/nfs-most-wanted-mac.git
          git fetch upstream main
          BASE="$(cat .github/upstream-baseline.sha)"
          LATEST="$(git rev-parse upstream/main)"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          BRANCH="upstream-update/${LATEST:0:12}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git fetch upstream "$BASE"
          if [ "$BASE" = "$LATEST" ]; then
            echo "No new upstream commits."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$BASE" "$LATEST"; then
            echo "::warning::Upstream history changed. Manual review required."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Review branch already exists: $BRANCH"
            exit 0
          fi
          git switch -c "$BRANCH"
          # Replaying only commits after the recorded baseline avoids merging
          # unrelated repository histories into the working iOS port.
          mapfile -t COMMITS < <(git rev-list --reverse --ancestry-path "$BASE..$LATEST")
          for COMMIT in "${COMMITS[@]}"; do
            if ! git cherry-pick "$COMMIT"; then
              {
                echo "Upstream base: $BASE"
                echo "Latest upstream: $LATEST"
                echo "Failed to apply: $COMMIT"
                git status --short
              } > upstream-conflicts.txt
              git cherry-pick --abort || true
              echo "Conflicts require manual porting; iOS main is unchanged."
              exit 0
            fi
          done
          printf '%s\n' "$LATEST" > .github/upstream-baseline.sha
          git add .github/upstream-baseline.sha
          git commit -m "Advance upstream baseline to ${LATEST:0:12}"
          git push origin "$BRANCH"
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Create review pull request
        if: steps.check.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.check.outputs.branch }}
          SHA: ${{ steps.check.outputs.latest }}
        run: |
          gh pr create --base main --head "$BRANCH" \
            --title "Review upstream changes ${SHA:0:12}" \
            --body "New commits from elforeign/nfs-most-wanted-mac since the tracked baseline. Do not merge until the iOS build and gameplay have been tested."

      - name: Upload conflict report
        if: hashFiles('upstream-conflicts.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upstream-conflicts
          path: upstream-conflicts.txt
