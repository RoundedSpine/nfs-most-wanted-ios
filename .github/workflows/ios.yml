name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          clang --version

      - name: Download NFS Most Wanted game
        env:
          MEGA_GAME_URL: ${{ secrets.MEGA_GAME_URL }}
        run: |
          set -euo pipefail

          echo "Installing MEGA tools..."
          brew install megatools

          mkdir -p "$RUNNER_TEMP/nfsmw"

          echo "Downloading NFS Most Wanted archive..."
          megadl "$MEGA_GAME_URL" --path "$RUNNER_TEMP/nfsmw"

          echo "Downloaded files:"
          ls -lh "$RUNNER_TEMP/nfsmw"

          ARCHIVE="$(find "$RUNNER_TEMP/nfsmw" -maxdepth 1 -type f -name '*.7z' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No .7z archive was downloaded."
            exit 1
          fi

          echo "Archive: $ARCHIVE"

          echo "Installing 7-Zip..."
          brew install sevenzip

          echo "Extracting game..."
          mkdir -p "$RUNNER_TEMP/nfsmw/game"

          7zz x "$ARCHIVE" -o"$RUNNER_TEMP/nfsmw/game"

          GAME_DIR="$RUNNER_TEMP/nfsmw/game"

          echo "Checking extracted game..."

          if [ ! -f "$GAME_DIR/speed.exe" ]; then
            echo "ERROR: speed.exe not found."
            find "$GAME_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          SPEED_SIZE="$(stat -f%z "$GAME_DIR/speed.exe")"

          if [ "$SPEED_SIZE" != "6029312" ]; then
            echo "ERROR: Unexpected speed.exe size: $SPEED_SIZE"
            exit 1
          fi

          echo "speed.exe verified: $SPEED_SIZE bytes"

          for DIR in CARS FRONTEND GLOBAL SOUND TRACKS; do
            if [ ! -d "$GAME_DIR/$DIR" ]; then
              echo "ERROR: Missing required directory: $DIR"
              exit 1
            fi
          done

          echo "All required NFS Most Wanted files verified."

      - name: Configure iOS build
        run: |
          chmod +x ./ios-build.sh
          ./ios-build.sh --configure-only "${{ github.event.inputs.build_type || 'Release' }}"

      - name: Build iOS
        run: |
          ./ios-build.sh --build-only "${{ github.event.inputs.build_type || 'Release' }}"

      - name: Locate application
        run: |
          mkdir -p artifacts

          APP="$(find . -type d -name '*.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found."
            exit 1
          fi

          echo "Found app: $APP"

          cp -R "$APP" artifacts/NFSMostWanted.app

      - name: Create unsigned IPA
        run: |
          mkdir -p artifacts/Payload

          cp -R artifacts/NFSMostWanted.app artifacts/Payload/NFSMostWanted.app

          cd artifacts
          zip -qry NFSMostWanted-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NFSMostWanted-iOS
          path: |
            artifacts/NFSMostWanted.app
            artifacts/NFSMostWanted-iOS-unsigned.ipa
            build/**/*.dSYM
          if-no-files-found: warn
