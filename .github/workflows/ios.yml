
name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Instrumentation profile'
        required: true
        type: choice
        options:
          - diagnostic
          - performance
        default: diagnostic
      disable_device_core_haptics:
        description: 'Disable device Core Haptics rumble'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Show toolchain
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          python3.12 --version

      - name: Download and verify game
        env:
          MEGA_GAME_URL: ${{ secrets.MEGA_GAME_URL }}
        run: |
          set -euo pipefail

          if [ -z "$MEGA_GAME_URL" ]; then
            echo "ERROR: MEGA_GAME_URL secret is missing."
            exit 1
          fi

          brew install megatools sevenzip
          mkdir -p "$RUNNER_TEMP/nfsmw/game"

          megadl "$MEGA_GAME_URL" --path "$RUNNER_TEMP/nfsmw"

          ARCHIVE="$(find "$RUNNER_TEMP/nfsmw" -maxdepth 1 -type f -name '*.7z' -print -quit)"
          test -n "$ARCHIVE" || {
            echo "ERROR: Archive missing."
            exit 1
          }

          7zz x "$ARCHIVE" -o"$RUNNER_TEMP/nfsmw/game"

          GAME_DIR="$RUNNER_TEMP/nfsmw/game"

          # setup.py owns executable normalization/hash checks and required
          # folders; avoid a second, case-sensitive copy of those rules here.
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"
          echo "Game archive extracted; setup validates its contents next."

      - name: Cache verified public tool archives
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/NFSMW-Native-Setup/*.zip
            ~/Library/NFSMW-Native-Setup/*.tar.gz
          key: nfsmw-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/setup_kit/setup.py', 'setup.sh') }}

      - name: Prepare game translation and assets for iOS
        run: |
          set -euo pipefail

          # Prevent NumPy source compilation.
          export PIP_ONLY_BINARY=numpy

          echo "Python 3.12 location:"
          command -v python3.12
          python3.12 --version

          chmod +x ./setup.sh
          ./setup.sh "$GAME_DIR" --prepare-ios

          test -f build/recomp/gen/table.c || {
            echo "ERROR: Translation output missing."
            exit 1
          }

      - name: Configure build options
        env:
          PROFILE: ${{ inputs.build_profile || 'diagnostic' }}
          HAPTICS_OFF: ${{ inputs.disable_device_core_haptics }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            diagnostic) FLAGS="-DNFSMW_PERFORMANCE_BUILD=0" ;;
            performance) FLAGS="-DNFSMW_PERFORMANCE_BUILD=1" ;;
            *) exit 1 ;;
          esac
          if [ "$HAPTICS_OFF" = "true" ]; then
            FLAGS="$FLAGS -DNFSMW_DISABLE_DEVICE_CORE_HAPTICS=1"
          fi
          echo "CXXFLAGS=$FLAGS" >> "$GITHUB_ENV"
          echo "OBJCXXFLAGS=$FLAGS" >> "$GITHUB_ENV"

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          ./.venv/bin/python --version

          ./github-actions-ios-build.sh --config Release

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP="$(find build/ios -type d -name 'SpeedRecomp.app' -print -quit)"

          test -n "$APP" || {
            echo "ERROR: iOS app missing."
            exit 1
          }

          mkdir -p artifacts/Payload

          ditto "$APP" artifacts/Payload/SpeedRecomp.app

          (
            cd artifacts
            /usr/bin/zip -qry NFSMostWanted-iOS-unsigned.ipa Payload
          )

          rm -rf artifacts/Payload

          test -s artifacts/NFSMostWanted-iOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NFSMostWanted-iOS-unsigned
          path: artifacts/NFSMostWanted-iOS-unsigned.ipa
          if-no-files-found: error
