name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show toolchain
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Download and verify game
        env:
          MEGA_GAME_URL: ${{ secrets.MEGA_GAME_URL }}
        run: |
          set -euo pipefail

          if [ -z "$MEGA_GAME_URL" ]; then
            echo "ERROR: MEGA_GAME_URL secret is missing."
            exit 1
          fi

          brew install megatools sevenzip
          mkdir -p "$RUNNER_TEMP/nfsmw/game"

          megadl "$MEGA_GAME_URL" --path "$RUNNER_TEMP/nfsmw"

          ARCHIVE="$(find "$RUNNER_TEMP/nfsmw" -maxdepth 1 -type f -name '*.7z' -print -quit)"
          test -n "$ARCHIVE" || { echo "ERROR: Archive missing."; exit 1; }

          7zz x "$ARCHIVE" -o"$RUNNER_TEMP/nfsmw/game"

          GAME_DIR="$RUNNER_TEMP/nfsmw/game"

          test -f "$GAME_DIR/speed.exe" || { echo "ERROR: speed.exe missing."; exit 1; }

          SPEED_SIZE="$(stat -f%z "$GAME_DIR/speed.exe")"
          test "$SPEED_SIZE" = "6029312" || { echo "ERROR: Wrong speed.exe size."; exit 1; }

          for DIR in CARS FRONTEND GLOBAL SOUND TRACKS; do
            test -d "$GAME_DIR/$DIR" || { echo "ERROR: Missing $DIR."; exit 1; }
          done

          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"
          echo "Game files verified."

      - name: Setup and translate game
        run: |
          set -euo pipefail
          chmod +x ./setup.sh
          ./setup.sh "$GAME_DIR"

          test -f build/recomp/gen/table.c || {
            echo "ERROR: Translation output missing."
            exit 1
          }

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          ./.venv/bin/python kit/tools/build.py \
            --game-dir "$GITHUB_WORKSPACE" \
            --target ios \
            --config Release \
            --unsigned \
            --no-install

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP="$(find build/ios -type d -name 'SpeedRecomp.app' -print -quit)"
          test -n "$APP" || { echo "ERROR: iOS app missing."; exit 1; }

          mkdir -p artifacts/Payload
          ditto "$APP" artifacts/Payload/SpeedRecomp.app

          (
            cd artifacts
            /usr/bin/zip -qry NFSMostWanted-iOS-unsigned.ipa Payload
          )

          rm -rf artifacts/Payload
          test -s artifacts/NFSMostWanted-iOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NFSMostWanted-iOS-unsigned
          path: artifacts/NFSMostWanted-iOS-unsigned.ipa
          if-no-files-found: error
