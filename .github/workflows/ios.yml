
name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Instrumentation profile (independent of haptics)'
        required: true
        type: choice
        options:
          - diagnostic
          - performance
        default: diagnostic
      disable_device_core_haptics:
        description: 'Diagnostic control: disable device Core Haptics (controller rumble stays enabled)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Show toolchain
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          python3.12 --version

      - name: Download and verify game
        env:
          MEGA_GAME_URL: ${{ secrets.MEGA_GAME_URL }}
        run: |
          set -euo pipefail

          if [ -z "$MEGA_GAME_URL" ]; then
            echo "ERROR: MEGA_GAME_URL secret is missing."
            exit 1
          fi

          brew install megatools sevenzip
          mkdir -p "$RUNNER_TEMP/nfsmw/game"

          megadl "$MEGA_GAME_URL" --path "$RUNNER_TEMP/nfsmw"

          ARCHIVE="$(find "$RUNNER_TEMP/nfsmw" -maxdepth 1 -type f -name '*.7z' -print -quit)"
          test -n "$ARCHIVE" || {
            echo "ERROR: Archive missing."
            exit 1
          }

          7zz x "$ARCHIVE" -o"$RUNNER_TEMP/nfsmw/game"

          GAME_DIR="$RUNNER_TEMP/nfsmw/game"

          test -f "$GAME_DIR/speed.exe" || {
            echo "ERROR: speed.exe missing."
            exit 1
          }

          SPEED_SIZE="$(stat -f%z "$GAME_DIR/speed.exe")"
          test "$SPEED_SIZE" = "6029312" || {
            echo "ERROR: Wrong speed.exe size."
            exit 1
          }

          for DIR in CARS FRONTEND GLOBAL SOUND TRACKS; do
            test -d "$GAME_DIR/$DIR" || {
              echo "ERROR: Missing $DIR."
              exit 1
            }
          done

          # Optional visual packs supplied by the user's own game archive.
          # Validate their structure without failing builds that intentionally omit them.
          TEX_DIR="$GAME_DIR/TRACKS/TexWizardX360"
          if [ -f "$TEX_DIR/meta.json" ] && [ -f "$TEX_DIR/textures.bin" ]; then
            echo "Optional Xbox 360 textures: present."
          elif [ -e "$TEX_DIR" ]; then
            echo "::warning::TexWizardX360 exists but meta.json or textures.bin is missing."
          else
            echo "Optional Xbox 360 textures: not supplied."
          fi

          if [ -s "$GAME_DIR/scripts/XenonEffects.tpk" ]; then
            echo "Optional XenonEffects.tpk: present."
          else
            echo "Optional XenonEffects.tpk: not supplied."
          fi

          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"
          echo "Game files verified."

      - name: Set up and translate game
        run: |
          set -euo pipefail

          # Force setup.sh to skip Python 3.13.
          mkdir -p "$RUNNER_TEMP/python312-first"

          cat > "$RUNNER_TEMP/python312-first/python3.13" <<'EOF'
          #!/bin/sh
          exit 1
          EOF

          chmod +x "$RUNNER_TEMP/python312-first/python3.13"
          export PATH="$RUNNER_TEMP/python312-first:$PATH"

          # Prevent NumPy source compilation.
          export PIP_ONLY_BINARY=numpy

          echo "Python 3.12 location:"
          command -v python3.12
          python3.12 --version

          chmod +x ./setup.sh
          if ! ./setup.sh "$GAME_DIR"; then
            echo "::group::Setup failure details (last 250 lines)"
            if [ -f build/setup.log ]; then
              tail -n 250 build/setup.log
            else
              echo "build/setup.log was not created"
            fi
            echo "::endgroup::"
            exit 1
          fi

          test -f build/recomp/gen/table.c || {
            echo "ERROR: Translation output missing."
            exit 1
          }

      - name: Configure instrumentation profile
        env:
          BUILD_PROFILE: ${{ inputs.build_profile || 'diagnostic' }}
        run: |
          set -euo pipefail
          case "$BUILD_PROFILE" in
            diagnostic) FLAGS='-DNFSMW_PERFORMANCE_BUILD=0' ;;
            performance) FLAGS='-DNFSMW_PERFORMANCE_BUILD=1' ;;
            *) echo "::error::Unknown build profile: $BUILD_PROFILE"; exit 1 ;;
          esac
          echo "BUILD_PROFILE=$BUILD_PROFILE" >> "$GITHUB_ENV"
          echo "CXXFLAGS=$FLAGS" >> "$GITHUB_ENV"
          echo "OBJCXXFLAGS=$FLAGS" >> "$GITHUB_ENV"

      - name: Configure Core Haptics isolation
        env:
          DISABLE_DEVICE_CORE_HAPTICS: ${{ inputs.disable_device_core_haptics }}
        run: |
          set -euo pipefail
          if [ "$DISABLE_DEVICE_CORE_HAPTICS" = "true" ]; then
            echo "CXXFLAGS=${CXXFLAGS:-} -DNFSMW_DISABLE_DEVICE_CORE_HAPTICS=1" >> "$GITHUB_ENV"
            echo "OBJCXXFLAGS=${OBJCXXFLAGS:-} -DNFSMW_DISABLE_DEVICE_CORE_HAPTICS=1" >> "$GITHUB_ENV"
            echo "CORE_HAPTICS_MODE=disabled" >> "$GITHUB_ENV"
          else
            echo "CORE_HAPTICS_MODE=enabled" >> "$GITHUB_ENV"
          fi

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          ./.venv/bin/python --version

          ./.venv/bin/python kit/tools/build.py \
            --game-dir "$GITHUB_WORKSPACE" \
            --target ios \
            --config Release \
            --unsigned \
            --no-install

      # TEMPORARY: collect build-system evidence without modifying any build inputs.
      - name: Capture FFmpeg and SDL3 linker diagnostics (temporary)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          OUT="artifacts/toolchain-investigation"
          mkdir -p "$OUT/ffmpeg" "$OUT/sdl3" "$OUT/linker"
          ROOT="build/cmake/ios"
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$OUT/manifest.txt"

          # Capture generated FFmpeg configuration, not game assets or downloaded source.
          find "$ROOT" -type f \( -name config.mak -o -name config.h -o -name library.mak \) -path '*ffmpeg*' -print 2>/dev/null > "$OUT/ffmpeg/config-file-paths.txt" || true
          while IFS= read -r f; do
            case "$f" in
              */config.mak|*/config.h|*/library.mak)
                dest="$OUT/ffmpeg/$(echo "$f" | sed 's#[/ ]#_#g')"
                cp "$f" "$dest" 2>/dev/null || true ;;
            esac
          done < "$OUT/ffmpeg/config-file-paths.txt"
          find "$ROOT" -type f -name 'aac_ac3_parser.c' -path '*ffmpeg*' -print -quit 2>/dev/null |
          while IFS= read -r f; do
            sed -n '65,195p' "$f" > "$OUT/ffmpeg/aac_ac3_parser-lines65-195.txt"
          done

          # Capture FFmpeg's generated link recipes and flags.
          find "$ROOT" -type f \( -name Makefile -o -name 'config.mak' -o -name 'library.mak' \) -path '*ffmpeg*' -print 2>/dev/null |
          while IFS= read -r f; do
            grep -nE -- 'single_module|libpostproc|libswscale|libswresample|(^|[[:space:]])-lm|LDFLAGS|SHFLAGS|SLIB' "$f" 2>/dev/null |
              head -n 160 | sed "s#^#$f:#" >> "$OUT/ffmpeg/link-flag-origins.txt" || true
          done

          # Examine Mach-O alignment metadata and common symbols; do not archive object files.
          find "$ROOT" -type f \( -name '*.o' -o -name '*.dylib' \) -path '*ffmpeg*' -print 2>/dev/null > "$OUT/linker/ffmpeg-objects.txt" || true
          if command -v xcrun >/dev/null; then
            while IFS= read -r f; do
              case "$f" in
                *.o)
                  xcrun nm -m "$f" 2>/dev/null | grep -Ei 'common|align' |
                    head -n 40 | sed "s#^#$f: #" >> "$OUT/linker/ffmpeg-common-symbols.txt" || true ;;
                *libavcodec*.dylib)
                  xcrun otool -l "$f" > "$OUT/linker/libavcodec-load-commands.txt" 2>&1 || true ;;
              esac
            done < "$OUT/linker/ffmpeg-objects.txt"
          fi
          find "$ROOT" -type f \( -name '*.resp' -o -name 'project.pbxproj' \) -path '*sdl3*' -print 2>/dev/null > "$OUT/sdl3/generated-files.txt" || true
          find "$ROOT" -type f -name '*.resp' -path '*SDL3-static*' -print 2>/dev/null |
          while IFS= read -r f; do
            grep -nE -- '(^|[[:space:]])-x[[:space:]]|objective-c|pch|PCH' "$f" |
              head -n 80 | sed "s#^#$f:#" >> "$OUT/sdl3/response-flags.txt" || true
          done
          find "$ROOT" -type f -name project.pbxproj -print 2>/dev/null |
          while IFS= read -r f; do
            grep -nE 'GCC_PRECOMPILE_PREFIX_HEADER|GCC_PREFIX_HEADER|PRECOMPILE_HEADERS|OTHER_CFLAGS|OTHER_LDFLAGS|objc' "$f" |
              head -n 140 | sed "s#^#$f:#" >> "$OUT/sdl3/xcode-settings.txt" || true
          done
          echo "Temporary toolchain investigation captured in $OUT"

      - name: Upload temporary toolchain investigation
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NFSMostWanted-iOS-toolchain-investigation
          path: artifacts/toolchain-investigation/
          if-no-files-found: warn

      - name: Create requested signing entitlements
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > artifacts/RequestedEntitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.kernel.increased-memory-limit</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint artifacts/RequestedEntitlements.plist

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find build/ios -type d -name 'SpeedRecomp.app' -print -quit)"
          test -n "$APP" || { echo "::error::iOS app missing"; exit 1; }
          mkdir -p artifacts/Payload
          ditto "$APP" artifacts/Payload/SpeedRecomp.app
          cp artifacts/RequestedEntitlements.plist artifacts/Payload/SpeedRecomp.app/RequestedEntitlements.plist
          (cd artifacts && /usr/bin/zip -qry NFSMostWanted-iOS-unsigned.ipa Payload)
          rm -rf artifacts/Payload
          test -s artifacts/NFSMostWanted-iOS-unsigned.ipa

      - name: Verify IPA and generate matching symbolication
        run: |
          set -euo pipefail
          IPA="artifacts/NFSMostWanted-iOS-unsigned.ipa"
          test -s "$IPA"
          unzip -tq "$IPA"
          mkdir -p artifacts/build-diagnostics artifacts/symbolication
          /usr/bin/unzip -p "$IPA" Payload/SpeedRecomp.app/Info.plist > artifacts/build-diagnostics/Info.plist
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' artifacts/build-diagnostics/Info.plist)"
          test "$BUNDLE_ID" = "dev.recompkit.nfsmw" || { echo "::error::Unexpected bundle identifier: $BUNDLE_ID"; exit 1; }
          {
            echo "build_profile=${BUILD_PROFILE:-diagnostic}"
             echo "core_haptics_mode=${CORE_HAPTICS_MODE:-enabled}"
            echo "source_commit=$GITHUB_SHA"
            echo "source_ref=$GITHUB_REF"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "bundle_id=$BUNDLE_ID"
            echo "ipa_sha256=$(shasum -a 256 "$IPA" | awk '{print $1}')"
            echo "ios_sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
          } > artifacts/build-diagnostics/build-manifest.txt
          APP="$(find build/ios -type d -name 'SpeedRecomp.app' -print -quit)"
          test -n "$APP"
          EXEC="$APP/SpeedRecomp"
          test -f "$EXEC"
          /usr/bin/unzip -p "$IPA" Payload/SpeedRecomp.app/SpeedRecomp > artifacts/symbolication/SpeedRecomp
          chmod +x artifacts/symbolication/SpeedRecomp
          xcrun dsymutil "$EXEC" -o artifacts/symbolication/SpeedRecomp.app.dSYM
          DWARF=artifacts/symbolication/SpeedRecomp.app.dSYM/Contents/Resources/DWARF/SpeedRecomp
          test -s "$DWARF"
          xcrun dwarfdump --uuid artifacts/symbolication/SpeedRecomp > artifacts/symbolication/executable-uuid.txt
          xcrun dwarfdump --uuid artifacts/symbolication/SpeedRecomp.app.dSYM > artifacts/symbolication/dsym-uuid.txt
          awk '{print $2, $3}' artifacts/symbolication/executable-uuid.txt | sort > artifacts/symbolication/executable-uuid-pairs.txt
          awk '{print $2, $3}' artifacts/symbolication/dsym-uuid.txt | sort > artifacts/symbolication/dsym-uuid-pairs.txt
          test -s artifacts/symbolication/executable-uuid-pairs.txt
          diff -u artifacts/symbolication/executable-uuid-pairs.txt artifacts/symbolication/dsym-uuid-pairs.txt
          xcrun dwarfdump --debug-info "$DWARF" > artifacts/symbolication/dwarf-info-check.txt
          grep -q 'DW_TAG_compile_unit' artifacts/symbolication/dwarf-info-check.txt || { echo "::error::No DWARF compile units"; exit 1; }
          rm artifacts/symbolication/dwarf-info-check.txt
          cp artifacts/build-diagnostics/build-manifest.txt artifacts/symbolication/build-manifest.txt
          echo "Matching dSYM and packaged executable verified"

      - name: Collect setup failure diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/build-diagnostics
          if [ -f build/setup.log ]; then
            cp build/setup.log artifacts/build-diagnostics/setup.log
          fi
          if [ -f build/recomp/gen/table.c ]; then
            ls -lh build/recomp/gen/table.c > artifacts/build-diagnostics/translation-output.txt
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NFSMostWanted-iOS-build-diagnostics
          path: artifacts/build-diagnostics/
          if-no-files-found: warn

      - name: Upload symbolication files
        uses: actions/upload-artifact@v6
        with:
          name: NFSMostWanted-iOS-symbolication
          path: artifacts/symbolication/
          if-no-files-found: error

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: NFSMostWanted-iOS-unsigned
          path: artifacts/NFSMostWanted-iOS-unsigned.ipa
          if-no-files-found: error
